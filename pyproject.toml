[project]
name = "gma2-mcp"
version = "0.1.0"
description = "MCP server for controlling grandMA2 lighting consoles via Telnet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.21.0",
    "python-dotenv>=1.0.0",
    "telnetlib3>=2.0.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
gma2-mcp = "src.server:main"

# --- 品質護欄（綠燈=完成）---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W=pycodestyle, F=pyflakes, I=isort, UP=pyupgrade, B=bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行長由 formatter 處理，不重複報

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # __init__ 為公開 API re-export hub，匯入即匯出

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true   # telnetlib3 等無型別 stub
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# 起步從寬：先把護欄掛上、保持綠燈；日後可逐步收緊（disallow_untyped_defs 等）
